version: 2

models:
  - name: stg_tradingview__market_bars
    description: Standardized staging view over raw TradingView market bars.
    columns:
      - name: source
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['TRADINGVIEW']

      - name: provider
        tests:
          - not_null

      - name: symbol
        tests:
          - not_null

      - name: timeframe
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['D']

      - name: raw_timestamp
        tests:
          - not_null

      - name: raw_timestamp_utc
        tests:
          - not_null

      - name: open
        tests:
          - not_null

      - name: high
        tests:
          - not_null

      - name: low
        tests:
          - not_null

      - name: close
        tests:
          - not_null

      - name: source_file
        tests:
          - not_null

  - name: stg_dukascopy__market_bars
    description: Standardized staging view over raw Dukascopy market bars.
    columns:
      - name: source
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['DUKASCOPY']

      - name: price_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['BID']

      - name: symbol
        tests:
          - not_null

      - name: timeframe
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['H1']

      - name: bar_start_utc
        tests:
          - not_null

      - name: open
        tests:
          - not_null

      - name: high
        tests:
          - not_null

      - name: low
        tests:
          - not_null

      - name: close
        tests:
          - not_null

      - name: volume
        tests:
          - not_null

      - name: source_file
        tests:
          - not_null
